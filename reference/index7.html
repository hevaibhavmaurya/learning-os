 {id:uid(),title:'The race condition that refunded a customer twice',status:'ready',week:9,project:'P02',date:t+2*DAY,urls:{},images:[],updated:t-DAY,deleted:false,
  li:'Last week I reproduced a bug that sounds made up: one refund request, two refunds.\n\nTwo workers picked up the same webhook within 40 ms. Both read the order as "paid", both issued a refund. Postgres was doing exactly what READ COMMITTED promises.\n\nHow I found it:\n1. Opened two psql sessions and replayed the steps by hand\n2. Saw both SELECTs return status = paid\n3. Wrote a failing test that fires 50 concurrent requests\n\nThe fix was one line: UPDATE orders SET status = \'refunding\' WHERE id = $1 AND status = \'paid\' RETURNING id. If no row comes back, someone else already won.\n\nResult: 0 duplicate refunds across 10,000 simulated concurrent requests (local test, single node).\n\nLimitation: this guards one table. Cross-service idempotency still needs a key.\n\n#postgres #backend',

  <section aria-labelledby="gp-h"><h3 id="gp-h" class="text-sm font-medium mb-3">Unresolved gap</h3>

  <section aria-labelledby="qc-h"><h3 id="qc-h" class="text-sm font-medium mb-3">Capture a thought</h3>

   <p class="text-xs muted mt-2">Saved to Library, linked to Week ${n}. Start with "idea:" to save a project idea.</p></section>

  <section aria-labelledby="pm-h"><h3 id="pm-h" class="text-sm font-medium mb-3">Project milestone</h3>
   <a href="#/projects/${proj.id}" class="block rounded-xl border line p-4 hover:bg-[var(--sunk)]"><div class="flex items-center gap-2 text-xs muted">${proj.id} · ${esc(proj.name)}</div><div class="text-sm mt-1 font-medium">${esc(ms)}</div></a></section>
 </div>

 <a href="#/progress" class="mt-10 flex items-center gap-4 text-sm group"><span class="flex-1 h-1.5 rounded-full sunk overflow-hidden"><span class="block h-full rounded-full" style="width:${Math.max(.6,v/91*100)}%;background:var(--forest)"></span></span><span class="muted group-hover:underline whitespace-nowrap"><b class="forest font-semibold">${v}</b> of 91 weeks verified</span></a>
 </div>`}
function projMilestoneFor(p,n){const m=(p.milestones||'').split(/;\s*/);const hit=m.find(x=>{const r=x.match(/W(\d+)-(\d+)/);return r&&n>=+r[1]&&n<=+r[2]});return hit||m[0]||'See project contract'}
function quickCapture(e){e.preventDefault();const v=$('#qc').value.trim();if(!v)return;const n=currentWeek();
 if(/^idea:/i.test(v)){S.ideas.unshift({id:uid(),text:v.replace(/^idea:\s*/i,''),at:now()});commit('Idea saved to Projects');return}
 const isUrl=/^https?:\/\//.test(v);S.notes.unshift({id:uid(),kind:isUrl?'resource':'note',title:isUrl?v.replace(/^https?:\/\/(www\.)?/,'').slice(0,60):v.slice(0,80),body:isUrl?'':'<p>'+esc(v)+'</p>',url:isUrl?v:'',tags:['inbox'],week:n,project:'',updated:now(),archived:false,deleted:false});commit(isUrl?'Resource saved to Library':'Note saved to Library')}
function openReview(id){const r=S.reviews.find(x=>x.id==id),wd=W(r.week);
 const L=modal('Week '+r.week+' review, +'+r.off+' weeks',`<p class="text-sm ink2">Retest with a <b>different</b> task than last time. No notes for the first 10 minutes.</p>
 <div class="sunk rounded-lg p-4 mt-4 text-sm"><div class="text-xs muted mb-1">Prompt</div>${esc(wd.unseen.split('. Test the result')[0])}.</div>
 <label class="block text-xs muted mt-4 mb-1.5" for="rvn">What you recalled, what you missed</label><textarea id="rvn" rows="3" class="inp"></textarea>`,{actions:`<button class="btn" id="rvf">${ic('x')}Could not recall</button><button class="btn btn-p" id="rvp">${ic('check')}Recalled it</button>`});
 $('#rvp',L).onclick=()=>{completeReview(id,true,$('#rvn',L).value);closeLayer();commit('Review recorded. Retention holds.')};
 $('#rvf',L).onclick=()=>{completeReview(id,false,$('#rvn',L).value);closeLayer();commit('Review recorded. A gap was added; your verification stays.')}}

// ===== Roadmap =====
const stateColor=s=>({VERIFIED:'var(--forest)',DONE:'color-mix(in srgb,var(--forest) 45%,transparent)',ATTEMPTED:'var(--amber)',PLANNED:'color-mix(in srgb,var(--forest) 18%,var(--line))',LOCKED:'color-mix(in srgb,var(--line) 55%,transparent)'}[s]);
function varianceMsg(){const v=variance();if(verifiedCount()==0&&v.diff<=0)return'You are at the start. Planned dates are a guide, not a deadline.';
 if(v.diff<=0)return'You are on or ahead of the planned pace.';return`The plan pencilled in Week ${v.planned} for this week. You are on Week ${v.cur}, ${v.diff} week${v.diff>1?'s':''} later than the guide. Depth over speed is the point.`}
let RM_OPEN=null;
function viewRoadmap(){const cur=currentWeek(),v=verifiedCount();if(RM_OPEN===null)RM_OPEN=new Set([W(cur).blk]);
 const dueWeeks=new Set(reviewsDue().map(r=>r.week)),gapWeeks=new Set(openGaps().map(g=>g.week));
 const stage=st=>BLOCKS.filter(b=>b.stage==st).map(b=>{const ws=WEEKS.filter(w=>w.blk==b.n),vc=ws.filter(w=>isVerified(w.n)).length,open=RM_OPEN.has(b.n),here=cur>=b.a&&cur<=b.b;
  return `<li class="border-b line last:border-0"><button class="w-full flex items-center gap-4 py-4 text-left group" aria-expanded="${open}" onclick="toggleBlock(${b.n})">
   <span class="w-9 text-xs muted font-mono">B${String(b.n).padStart(2,'0')}</span>
   <span class="flex-1 min-w-0"><span class="block font-medium ${here?'':'ink2'}">${esc(b.name)} ${here?'<span class="chip chip-v ml-1.5">You are here</span>':''}</span><span class="block text-xs muted mt-0.5">Weeks ${b.a}-${b.b} · ${ws.length} weeks</span></span>
   <span class="hidden sm:flex gap-[3px] w-56">${ws.map(w=>`<span class="h-1.5 flex-1 rounded-full" style="background:${stateColor(weekState(w.n))}"></span>`).join('')}</span>
   <span class="text-xs muted w-12 text-right tabular-nums">${vc}/${ws.length}</span>${ic(open?'chevron-up':'chevron-down','muted')}</button>
   ${open?`<div class="pb-4 fade">${b.goal?`<p class="text-sm ink2 mb-3 sm:ml-[3.25rem] max-w-2xl"><span class="muted">Checkpoint.</span> ${esc(b.goal)}</p>`:''}<ul class="sm:ml-[3.25rem] rounded-xl border line overflow-hidden">${ws.map(w=>weekRow(w,cur,dueWeeks,gapWeeks)).join('')}</ul></div>`:''}</li>`}).join('');
 return `<div class="fade"><div class="flex flex-wrap items-end gap-4 justify-between"><div><p class="text-sm muted flex items-center gap-2">91 weeks · 14 blocks · 13 hours a week ${demoBadge()}</p><h1 class="serif text-4xl md:text-5xl mt-1">The journey</h1></div>
  <a class="btn btn-p" href="#/week/${cur}">${ic('arrow-right')}Open Week ${cur}</a></div>
 <section class="mt-8" aria-label="Overview of all 91 weeks"><div class="grid gap-[3px]" style="grid-template-columns:repeat(46,minmax(0,1fr))">${WEEKS.map(w=>{const s=weekState(w.n);return `<a href="#/week/${w.n}" class="wk block ${w.n==cur?'ring-2 ring-offset-1 ring-[var(--forest)] ring-offset-[var(--bg)]':''}" style="background:${stateColor(s)}" title="Week ${w.n}: ${esc(w.t)} (${s.toLowerCase()})" aria-label="Week ${w.n}: ${esc(w.t)}, ${s.toLowerCase()}"></a>`}).join('')}</div>
  <div class="flex flex-wrap gap-x-5 gap-y-1.5 mt-3 text-xs muted">${[['VERIFIED','Verified'],['DONE','Done, awaiting your verification'],['ATTEMPTED','Attempted'],['PLANNED','Unlocked'],['LOCKED','Locked']].map(([s,l])=>`<span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm" style="background:${stateColor(s)}"></span>${l}</span>`).join('')}<span class="ml-auto">${v} verified</span></div>
  <p class="text-sm ink2 mt-5 flex items-start gap-2 max-w-2xl">${ic('compass','forest mt-0.5 shrink-0')}${varianceMsg()}</p>
  ${S.locking?`<p class="text-xs muted mt-2 flex items-center gap-1.5">${ic('lock','!w-3 !h-3')}Strict locking is on: weeks open one at a time, no skipping or reordering.</p>`:`<p class="text-xs amber mt-2 flex items-center gap-1.5">${ic('lock-open','!w-3 !h-3')}Locking is off. Overrides are audited and never count as verification.</p>`}</section>
 <div class="mt-10 max-w-4xl"><section><h2 class="text-xs font-medium muted uppercase tracking-wider mb-1">Stage 1 · Ship as an FDE</h2><ul>${stage(1)}</ul></section><section class="mt-10"><h2 class="text-xs font-medium muted uppercase tracking-wider mb-1">Stage 2 · Deep fundamentals</h2><ul>${stage(2)}</ul></section></div></div>`}
function weekRow(w,cur,due,gap){const s=weekState(w.n),pw=peekWk(w.n),lock=s=='LOCKED';
 return `<li class="border-b line last:border-0"><a href="#/week/${w.n}" class="flex items-center gap-3 px-4 py-3 hover:bg-[var(--sunk)] ${w.n==cur?'sage':''}" ${lock?`aria-label="Week ${w.n}, locked"`:''}>
  <span class="w-7 text-xs font-mono ${lock?'muted':''}">${w.n}</span>
  <span class="flex-1 min-w-0"><span class="block text-sm truncate ${lock?'muted':'font-medium'}">${esc(w.t)}</span>${lock?`<span class="block text-[11px] muted">Opens after Week ${w.n-1} is verified</span>`:`<span class="block text-[11px] muted">${pw.verifiedAt?'Verified '+fmt(pw.verifiedAt)+' · planned '+fmt(plannedDate(w.n)):'Planned for '+fmt(plannedDate(w.n))}</span>`}</span>
  ${gap.has(w.n)?gapChip():''}${due.has(w.n)?reviewChip():''}${lock?ic('lock','muted'):statusChip(s)}</a></li>`}
function toggleBlock(n){RM_OPEN.has(n)?RM_OPEN.delete(n):RM_OPEN.add(n);render()}

// ===== Week workspace =====
const TABS=[['overview','Overview','info'],['learn','Learn','book-open'],['practise','Practise','pencil'],['build','Build','hammer'],['verify','Verify','shield-check'],['notes','Notes','notebook-pen']];
let DRAFT={};// in-progress gate scores per week
function viewWeek(n,tab){n=Math.min(91,Math.max(1,+n||1));tab=TABS.some(t=>t[0]==tab)?tab:'overview';const wd=W(n),b=BL(wd.blk),s=weekState(n),lock=s=='LOCKED';
 const flags=(openGaps().some(g=>g.week==n)?gapChip():'')+(reviewsDue().some(r=>r.week==n)?reviewChip():'');
 return `<div>
 <nav class="text-sm muted flex items-center gap-1.5" aria-label="Breadcrumb"><a href="#/roadmap" class="hover:underline">Roadmap</a>${ic('chevron-right','!w-3 !h-3')}<span>Block ${b.n} · ${esc(b.name)}</span></nav>
 <div class="flex flex-wrap items-start gap-3 mt-3"><h1 class="text-[1.75rem] md:text-3xl font-semibold tracking-tight flex-1 min-w-[16rem]"><span class="muted font-normal">Week ${n}</span> ${esc(wd.t)}</h1>
  <div class="flex items-center gap-1.5 pt-1.5">${flags}${statusChip(s)}${demoBadge()}</div>
  <div class="flex gap-1"><a class="btn btn-g btn-sm" ${n>1?`href="#/week/${n-1}/${tab}"`:'aria-disabled="true" tabindex="-1" style="opacity:.35;pointer-events:none"'} aria-label="Previous week">${ic('chevron-left')}</a><a class="btn btn-g btn-sm" ${n<91?`href="#/week/${n+1}/${tab}"`:'aria-disabled="true" tabindex="-1" style="opacity:.35;pointer-events:none"'} aria-label="Next week">${ic('chevron-right')}</a></div></div>
 ${lock?`<div class="mt-5 rounded-xl border bg-amber px-4 py-3 text-sm flex items-start gap-3">${ic('lock','mt-0.5 shrink-0')}<div><b>Locked.</b> Week ${n} opens when Week ${n-1} is manually verified. You can read ahead; attempts, evidence and verification are disabled.</div></div>`:''}
 <div role="tablist" aria-label="Week sections" class="mt-6 border-b line flex overflow-x-auto no-sb" onkeydown="tabKeys(event)">${TABS.map(([k,l,i])=>`<a role="tab" id="tab-${k}" aria-selected="${k==tab}" aria-controls="panel" tabindex="${k==tab?0:-1}" class="tab" href="#/week/${n}/${k}">${ic(i)}${l}</a>`).join('')}</div>
 <div id="panel" role="tabpanel" aria-labelledby="tab-${tab}" class="pt-7 pb-24 fade">${({overview:wOverview,learn:wLearn,practise:wPractise,build:wBuild,verify:wVerify,notes:wNotes})[tab](n,lock)}</div>
 ${nextBar(n,tab,lock)}</div>`}
function tabKeys(e){if(!['ArrowLeft','ArrowRight'].includes(e.key))return;const t=$$('[role=tab]'),i=t.indexOf(document.activeElement);if(i<0)return;const j=(i+(e.key=='ArrowRight'?1:-1)+t.length)%t.length;t[j].focus();t[j].click()}
function nextBar(n,tab,lock){let txt,btn;const w=peekWk(n),el=eligibility(n);
 if(lock){txt=`Locked until Week ${n-1} is verified`;btn=`<a class="btn btn-p" href="#/week/${currentWeek()}">${ic('arrow-left')}Go to Week ${currentWeek()}</a>`}
 else if(w.status=='VERIFIED'){txt=`Verified ${fmt(w.verifiedAt)}. Next review ${(S.reviews.filter(r=>r.week==n&&!r.doneAt).sort((a,b)=>a.due-b.due)[0]||{}).due?fmt(S.reviews.filter(r=>r.week==n&&!r.doneAt).sort((a,b)=>a.due-b.due)[0].due):'complete'}.`;btn=n<91?`<a class="btn btn-p" href="#/week/${n+1}">Week ${n+1}${ic('arrow-right')}</a>`:''}
 else if(el.ok){txt='Eligible. Review the evidence, then verify when you are satisfied.';btn=tab=='verify'?`<button class="btn btn-p" onclick="startVerify(${n})">${ic('badge-check')}Verify Week ${n}</button>`:`<a class="btn btn-p" href="#/week/${n}/verify">${ic('shield-check')}Go to Verify</a>`}
 else{const ns=nextStep(n);const map={overview:['learn','Start learning'],learn:['practise','Next: Practise'],practise:['build','Next: Build'],build:['verify','Next: Assess and verify'],notes:['verify','Go to Verify']};
  if(tab=='verify'){txt=el.reasons[0]||'';btn=`<button class="btn" onclick="document.getElementById('verify-gates').scrollIntoView({behavior:'smooth'})">${ic('arrow-up')}${!lastAttempt(n)||!gatesPass(lastAttempt(n))?'Score gates':'Complete evidence'}</button>`}
  else{txt=ns.hint;btn=`<a class="btn btn-p" href="#/week/${n}/${map[tab][0]}">${map[tab][1]}${ic('arrow-right')}</a>`}}
 return `<div class="fixed md:sticky bottom-16 md:bottom-4 inset-x-3 md:inset-x-auto z-20 mt-2"><div class="surface shadow-soft px-4 py-3 flex items-center gap-3"><span class="text-sm ink2 flex-1 min-w-0 truncate">${esc(txt)}</span>${btn}</div></div>`}
const sec=(t,body,cls='')=>`<section class="${cls}"><h2 class="text-xs font-medium muted uppercase tracking-wider mb-3">${t}</h2>${body}</section>`;
const linkList=ls=>`<ul class="space-y-2">${ls.map(l=>`<li class="flex items-center gap-3 group"><a href="${l.u}" target="_blank" rel="noopener" class="flex-1 min-w-0 flex items-center gap-3 rounded-lg border line px-3 py-2.5 hover:bg-[var(--sunk)]">${ic('book-marked','forest shrink-0')}<span class="text-sm truncate">${esc(l.t)}</span>${ic('arrow-up-right','muted ml-auto shrink-0')}</a><button class="btn btn-g btn-sm" onclick='saveResource(${JSON.stringify(l).replace(/'/g,"&#39;")})' aria-label="Save ${esc(l.t)} to Library">${ic(S.notes.some(x=>x.url==l.u&&!x.deleted)?'bookmark-check':'bookmark-plus')}</button></li>`).join('')}</ul>`;
function wOverview(n){const wd=W(n),b=BL(wd.blk),w=peekWk(n);const pre=[];
 pre.push(n==1?['Nothing before Week 1. Run the 2-hour diagnostic inside this week.',true]:[`Week ${n-1}: ${W(n-1).t} verified`,isVerified(n-1)]);
 if(n>=17&&n<=24)pre.push(['Python checkpoint by Week 24: exceptions, typing, packaging, pytest, async',n>24||isVerified(24)]);
 if(n>=48&&n<=53)pre.push(['Systems-language mini-check passed before Week 48',isVerified(47)]);
 if(n>=43&&n<=46)pre.push(['Data-use consent recorded, or project labelled SIMULATED',S.pilot.consent||S.pilot.simulated]);
 if(n>=74&&n<=79)pre.push(['GPU access within budget, or work labelled SIMULATION',false]);
 return `<div class="grid lg:grid-cols-[1fr_18rem] gap-10"><div class="space-y-8">
 ${sec('Outcomes',`<ul class="space-y-3 text-[15px] leading-relaxed"><li class="flex gap-3">${ic('target','forest mt-1 shrink-0')}<span>Explain and apply: ${esc(wd.learn)}</span></li><li class="flex gap-3">${ic('hammer','forest mt-1 shrink-0')}<span>Ship: ${esc(wd.build)}</span></li>${b.goal&&n==b.b?`<li class="flex gap-3">${ic('flag','forest mt-1 shrink-0')}<span>Block checkpoint: ${esc(b.goal)}</span></li>`:''}</ul>`)}
 ${sec('Prerequisites',`<ul class="space-y-2">${pre.map(([t,ok])=>`<li class="flex items-start gap-2.5 text-sm">${ic(ok?'circle-check':'circle-dashed',(ok?'forest':'muted')+' mt-0.5 shrink-0')}<span class="${ok?'':'ink2'}">${esc(t)}</span></li>`).join('')}</ul>`)}
 ${n>=43&&n<=46?pilotPanel(n):''}
 ${sec('This week\'s rhythm',`<div class="grid sm:grid-cols-4 gap-2 text-sm">${[['Mon-Tue','4 h','Learn','learn'],['Wed','2 h','Practise unseen','practise'],['Thu-Fri','5 h','Build and test','build'],['Sat','2 h','Assess and review','verify']].map(([d,h,l,t])=>`<a href="#/week/${n}/${t}" class="rounded-lg border line p-3 hover:bg-[var(--sunk)]"><div class="text-xs muted">${d} · ${h}</div><div class="font-medium mt-0.5">${l}</div></a>`).join('')}</div>`)}
 </div><aside class="space-y-6 text-sm">
  <div class="rounded-xl sunk p-4 space-y-2.5"><div class="flex justify-between"><span class="muted">Planned</span><span>${fmtY(plannedDate(n))}</span></div><div class="flex justify-between"><span class="muted">Started</span><span>${w.startedAt?fmt(w.startedAt):'Not yet'}</span></div><div class="flex justify-between"><span class="muted">Verified</span><span>${w.verifiedAt?fmt(w.verifiedAt):'Not yet'}</span></div><div class="flex justify-between"><span class="muted">Attempts</span><span>${w.attempts.length}</span></div><div class="flex justify-between"><span class="muted">Hours logged</span><span>${S.hours.filter(h=>h.week==n).reduce((a,h)=>a+h.h,0)} h</span></div></div>
  <div><div class="text-xs muted mb-2">Linked projects</div>${PROJ.filter(p=>n>=p.wa&&n<=p.wb).map(p=>`<a href="#/projects/${p.id}" class="block py-1.5 hover:underline">${p.id} · ${esc(p.name)}</a>`).join('')||'<span class="muted">None</span>'}</div>
 </aside></div>`}
function wLearn(n){const wd=W(n),b=BL(wd.blk);return `<div class="max-w-3xl space-y-9">
 ${sec('Core concepts',`<p class="text-[17px] leading-relaxed">${esc(wd.learn)}</p><p class="text-sm muted mt-2">Mon-Tue, about 4 hours: first principles, official docs, worked examples.</p>`)}

 <button class="btn" onclick="logHours(${n},'learn')">${ic('clock')}Log study time</button></div>`}

 ${sec('Unseen assessment, Saturday',`<div class="rounded-xl border line p-5 text-sm leading-relaxed ink2">${esc(wd.unseen)}</div>`)}
 <button class="btn" onclick="logHours(${n},'practise')">${ic('clock')}Log practice time</button></div>`}
function wBuild(n,lock){const wd=W(n),b=BL(wd.blk);const ps=PROJ.filter(p=>n>=p.wa&&n<=p.wb);return `<div class="max-w-3xl space-y-9">
 ${sec('Build or experiment',`<p class="text-[17px] leading-relaxed">${esc(wd.build)}</p><p class="text-sm muted mt-2">Thu-Fri, about 5 hours: small artifact, tests, fault injection.</p>`)}
 ${ps.length?sec('Project milestones',ps.map(p=>`<a href="#/projects/${p.id}" class="block rounded-xl border line p-4 hover:bg-[var(--sunk)] mb-2"><div class="text-xs muted">${p.id} · ${esc(p.name)} · ${p.scope}</div><div class="text-sm mt-1">${esc(projMilestoneFor(p,n))}</div></a>`).join('')):''}
 ${n==b.b&&b.end?sec('Block-end gate',`<div class="rounded-xl bg-amber border p-4 text-sm leading-relaxed">${esc(b.end)}</div>`):''}
 ${n>=43&&n<=46?pilotPanel(n):''}
 <button class="btn" onclick="logHours(${n},'build')">${ic('clock')}Log build time</button></div>`}
function wNotes(n){const ns=S.notes.filter(x=>x.week==n&&!x.deleted&&!x.archived);return `<div class="max-w-3xl">
 <div class="flex items-center justify-between mb-4"><p class="text-sm muted">${ns.length?ns.length+' items linked to this week':''}</p><button class="btn" onclick="editNote(null,{week:${n}})">${ic('plus')}New note</button></div>
 ${ns.length?`<ul class="divide-y line border-y line">${ns.map(noteRow).join('')}</ul>`:emptyState('notebook-pen','Nothing linked yet','Notes and saved resources you link to Week '+n+' collect here, so you can find them during reviews.')}</div>`}
function saveResource(l){if(S.notes.some(x=>x.url==l.u&&!x.deleted)){toast('Already in your Library');return}S.notes.unshift({id:uid(),kind:'resource',title:l.t,url:l.u,body:'',tags:['reading'],week:+route().rest[0]||currentWeek(),project:'',updated:now(),archived:false,deleted:false});commit('Saved to Library')}
function logHours(n,kind){const L=modal('Log time for Week '+n,`<label class="text-xs muted" for="lh">Hours</label><input id="lh" type="number" min="0.25" max="12" step="0.25" value="1.5" class="inp mt-1.5"><label class="text-xs muted block mt-3" for="lk">Activity</label><select id="lk" class="inp mt-1.5">${['learn','practise','build','assess'].map(k=>`<option ${k==kind?'selected':''}>${k}</option>`).join('')}</select>`,{actions:`<button class="btn" data-close>Cancel</button><button class="btn btn-p" id="lhok">Log time</button>`});
 $('#lhok',L).onclick=()=>{const h=+$('#lh',L).value;if(!(h>0)){toast('Enter hours above zero',{tone:'warn'});return}S.hours.unshift({id:uid(),at:now(),h,week:n,kind:$('#lk',L).value});const w=wk(n);if(!w.startedAt)w.startedAt=now();closeLayer();commit(h+' h logged')}}
let asT;function autosave(el){persist();const s=el.parentElement.querySelector('[data-saved]');if(s){s.textContent='Saving...';clearTimeout(asT);asT=setTimeout(()=>s.innerHTML='<span class="forest">Saved</span>',500)}}
// ---- Verify ----
function wVerify(n,lock){const w=peekWk(n),a=lastAttempt(n),el=eligibility(n),d=DRAFT[n]||(DRAFT[n]={r:0,b:0,d:0,t:0,assist:'independent',note:''});
 if(w.status=='VERIFIED')return verifiedSummary(n);
 const og=openGaps().filter(g=>g.week==n);const gapBox=og.length?`<div class="rounded-xl bg-rose p-4 mb-8 text-sm" style="color:var(--ink)"><div class="font-medium flex items-center gap-2"><span class="rose">${ic('circle-alert')}</span>${og.length} open gap${og.length>1?'s':''}: practise, then retry on a new unseen task</div><ul class="mt-2 space-y-1.5 ink2">${og.map(g=>`<li>${esc(g.title)}. <span class="muted">Retry: ${esc(g.retry.task)}.</span></li>`).join('')}</ul><p class="text-xs muted mt-2">Your active week stays Week ${n}. No penalty, no retry limit.</p></div>`:'';
 const seg=(k,v)=>`<div class="flex gap-1.5" role="radiogroup" aria-label="${GATES.find(g=>g[0]==k)[1]} score">${[0,1,2,3,4].map(i=>`<button role="radio" aria-checked="${v==i}" ${lock?'disabled':''} onclick="setGate(${n},'${k}',${i})" title="${SCORE_MEAN[i]}" class="h-9 w-9 rounded-lg border text-sm font-medium tabular-nums transition-colors ${v==i?(i>=3?'bg-forest border-transparent':'border-transparent'):'line hover:bg-[var(--sunk)]'}" style="${v==i&&i<3&&i>0?'background:var(--amber-bg);color:var(--amber)':v==i&&i==0?'background:var(--sunk);color:var(--muted)':''}">${i}</button>`).join('')}</div>`;
 return `${gapBox}<div class="grid lg:grid-cols-[1fr_19rem] gap-10"><div class="space-y-10 min-w-0">
 ${gatesPass(a)?`<section><h2 class="serif text-2xl">Four gates</h2><div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4">${GATES.map(([k,l])=>`<div class="rounded-xl sage p-4"><div class="text-xs opacity-80">${l}</div><div class="text-2xl font-semibold mt-1 tabular-nums">${a.gates[k]}<span class="text-sm font-normal opacity-70"> / 4</span></div></div>`).join('')}</div><p class="text-sm muted mt-3">Attempt ${w.attempts.length} on ${fmt(a.at)} passes every gate. ${a.assist}.</p></section>`:''}
 <${gatesPass(a)?'details':'section'} id="verify-gates">${gatesPass(a)?`<summary class="text-sm forest flex items-center gap-1.5">${ic('plus')}Record another attempt</summary><div class="mt-4">`:''}<div class="flex items-baseline justify-between"><h2 class="serif text-2xl">${gatesPass(a)?'New attempt':'Four gates'}</h2><span class="text-xs muted">Each needs 3 or more. No averaging.</span></div>
  <p class="text-sm muted mt-1">Score honestly after the unseen task. A new attempt never erases earlier ones.</p>
  <div class="mt-5 divide-y line border-y line">${GATES.map(([k,l,desc])=>`<div class="py-4 flex flex-col sm:flex-row sm:items-center gap-3"><div class="flex-1"><div class="font-medium text-sm">${l}</div><div class="text-xs muted mt-0.5">${desc}</div><div class="text-xs mt-1 ${d[k]>=3?'forest':d[k]>0?'amber':'muted'}" aria-live="polite">${SCORE_MEAN[d[k]]}</div></div>${seg(k,d[k])}</div>`).join('')}</div>
  <div class="grid sm:grid-cols-2 gap-3 mt-4"><div><label class="text-xs muted" for="as">Assistance during the attempt</label><select id="as" class="inp mt-1.5" ${lock?'disabled':''} onchange="DRAFT[${n}].assist=this.value">${['independent','docs-only','assisted'].map(x=>`<option ${d.assist==x?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="text-xs muted" for="an">What failed or surprised you</label><input id="an" class="inp mt-1.5" ${lock?'disabled':''} value="${esc(d.note)}" oninput="DRAFT[${n}].note=this.value"></div></div>
  <div class="flex items-center gap-3 mt-4"><button class="btn" ${lock?'disabled':''} onclick="saveAttempt(${n})">${ic('save')}Record attempt ${w.attempts.length+1}</button>${GATES.some(([k])=>d[k]>0&&d[k]<3)?`<span class="text-xs amber">Gates under 3 will open a gap and a new unseen retry.</span>`:''}</div>
 ${gatesPass(a)?'</div></details>':'</section>'}
 ${w.attempts.length?`<section><h2 class="text-xs font-medium muted uppercase tracking-wider mb-3">Attempt history</h2><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs muted text-left"><th class="font-normal pb-2">#</th><th class="font-normal pb-2">Date</th>${GATES.map(g=>`<th class="font-normal pb-2 text-center">${g[1]}</th>`).join('')}<th class="font-normal pb-2">Help</th><th class="font-normal pb-2">Result</th></tr></thead><tbody>${w.attempts.map((x,i)=>`<tr class="border-t line"><td class="py-2.5 muted">${i+1}</td><td>${fmt(x.at)}</td>${GATES.map(([k])=>`<td class="text-center tabular-nums ${x.gates[k]<3?'amber font-semibold':''}">${x.gates[k]}</td>`).join('')}<td class="muted">${x.assist}</td><td>${gatesPass(x)?'<span class="chip chip-v">Pass</span>':'<span class="chip chip-g">Gap</span>'}</td></tr>`).join('')}</tbody></table></div></section>`:''}
 <section><div class="flex items-baseline justify-between"><h2 class="serif text-2xl">Evidence</h2><span class="text-xs muted" data-saved>${EVIDENCE.length-evidenceMissing(n).length} of ${EVIDENCE.length}</span></div>
  <div class="mt-4 space-y-4">${EVIDENCE.map(([k,l,ph,i])=>`<div><label class="text-sm font-medium flex items-center gap-2" for="ev-${k}">${ic(i,'muted')}${l}${(w.evidence[k]||'').trim()?ic('check','forest ml-auto'):''}</label><textarea id="ev-${k}" rows="${k=='tests'?2:1}" class="inp mt-1.5" ${lock||w.status=='DONE'?'disabled':''} placeholder="${esc(ph)}" oninput="wk(${n}).evidence['${k}']=this.value;persist();evCount(${n})">${esc(w.evidence[k]||'')}</textarea></div>`).join('')}</div>
  ${w.status=='DONE'?`<div class="mt-4 flex items-center gap-3 text-sm"><span class="chip chip-d">${ic('circle-check','!w-3 !h-3')}Submitted ${fmt(w.submittedAt)}</span><button class="btn btn-sm btn-g" onclick="reopenEvidence(${n})">Edit evidence</button></div>`:`<button class="btn mt-4" ${lock?'disabled':''} onclick="trySubmit(${n})">${ic('send')}Submit evidence</button>`}
 </section></div>
 <aside class="lg:sticky lg:top-8 self-start space-y-4"><div class="rounded-xl ${el.ok?'sage':'sunk'} p-5"><div class="text-sm font-medium flex items-center gap-2">${ic(el.ok?'badge-check':'list-checks')}${el.ok?'Eligible for verification':'Before you can verify'}</div>
  ${el.ok?`<p class="text-sm mt-2 leading-relaxed">Passing scores do not verify a week on their own. Read your evidence once more, then decide.</p><p class="text-xs mt-3 opacity-80">Use the Verify button in the bar below.</p>`:`<ul class="mt-3 space-y-2 text-sm">${el.reasons.map(r=>`<li class="flex gap-2 ink2">${ic('circle','!w-3 !h-3 mt-1 shrink-0 muted')}${esc(r)}</li>`).join('')}</ul>`}</div>
  <p class="text-xs muted leading-relaxed px-1">Done means work and evidence are submitted. Verified means you reviewed passing evidence and approved it. Only Verified unlocks Week ${n+1}.</p></aside></div>`}
function setGate(n,k,v){DRAFT[n][k]=v;render()}
function evCount(n){const el=$('[data-saved]');if(el)el.textContent=(EVIDENCE.length-evidenceMissing(n).length)+' of '+EVIDENCE.length+' · saved'}
function saveAttempt(n){const d=DRAFT[n];if(GATES.some(([k])=>!d[k])){toast('Score all four gates first. 0 means not assessed.',{tone:'warn'});return}
 const a=recordAttempt(n,d,d.assist,d.note);DRAFT[n]=null;const fails=GATES.filter(([k])=>a.gates[k]<3).map(g=>g[1]);
 commit(fails.length?`Attempt saved. ${fails.join(', ')} below 3: gap opened, plan a new unseen retry.`:'Attempt saved. All gates pass. Finish the evidence next.')}
function trySubmit(n){const m=evidenceMissing(n);if(m.length){toast('Fill: '+m.map(x=>x[1]).join(', '),{tone:'warn'});$('#ev-'+m[0][0])?.focus();return}
 if(!gatesPass(lastAttempt(n))){toast('Evidence saved. The latest attempt still has a gate under 3.',{tone:'warn'});return}
 submitEvidence(n);commit('Evidence submitted. Week '+n+' is Done, not yet verified.')}
function reopenEvidence(n){wk(n).status='ATTEMPTED';commit('Evidence reopened for editing')}
function startVerify(n){const w=peekWk(n),a=lastAttempt(n);const L=modal('Verify Week '+n+'?',`<p class="text-sm ink2">You are confirming that this evidence shows independent, reproducible understanding. This unlocks Week ${n+1} and schedules reviews at +1, +4, +8 and +16 weeks from today.</p>
 <div class="grid grid-cols-4 gap-2 mt-4">${GATES.map(([k,l])=>`<div class="rounded-lg sunk p-2.5 text-center"><div class="text-[11px] muted">${l}</div><div class="text-lg font-semibold forest">${a.gates[k]}</div></div>`).join('')}</div>
 <ul class="mt-4 space-y-1.5 text-sm">${EVIDENCE.map(([k,l])=>`<li class="flex gap-2"><span class="muted w-36 shrink-0">${l}</span><span class="truncate">${esc(w.evidence[k])}</span></li>`).join('')}</ul>
 <label class="flex items-start gap-2.5 mt-5 text-sm"><input type="checkbox" id="vok" class="mt-0.5">I reviewed this evidence and it reflects my own work.</label>`,{wide:true,actions:`<button class="btn" data-close>Not yet</button><button class="btn btn-p" id="vgo" disabled>${ic('badge-check')}Verify Week ${n}</button>`});
 $('#vok',L).onchange=e=>$('#vgo',L).disabled=!e.target.checked;
 $('#vgo',L).onclick=()=>{if(verifyWeek(n)){closeLayer();persist();celebrate(n)}}}
function celebrate(n){modal('Week '+n+' verified',`<div class="text-center py-2"><div class="pop mx-auto h-16 w-16 rounded-full bg-forest grid place-items-center">${ic('badge-check','!w-8 !h-8')}</div><div class="serif text-3xl mt-4">${esc(W(n).t)}</div><p class="text-sm muted mt-2">${verifiedCount()} of 91 verified. First review on ${fmt(now()+WEEK)}.</p></div>`,{label:'Week verified',actions:n<91?`<button class="btn" data-close>Stay here</button><a class="btn btn-p" href="#/week/${n+1}" onclick="closeLayer()">Open Week ${n+1}${ic('arrow-right')}</a>`:''});render()}
function verifiedSummary(n){const w=peekWk(n),a=lastAttempt(n),rv=S.reviews.filter(r=>r.week==n).sort((x,y)=>x.off-y.off);return `<div class="max-w-3xl space-y-8">
 <div class="rounded-xl sage p-5 flex items-center gap-4">${ic('badge-check','!w-6 !h-6')}<div><div class="font-medium">Verified by you on ${fmtY(w.verifiedAt)}</div><div class="text-sm opacity-80">${w.attempts.length} attempt${w.attempts.length>1?'s':''} · final scores ${GATES.map(([k,l])=>l+' '+a.gates[k]).join(', ')}</div></div></div>
 ${sec('Retention reviews',`<ul class="grid sm:grid-cols-4 gap-2">${rv.map(r=>`<li class="rounded-lg border line p-3 text-sm"><div class="text-xs muted">+${r.off} weeks</div><div class="mt-0.5">${fmt(r.due)}</div><div class="text-xs mt-1 ${r.result=='pass'?'forest':r.result=='fail'?'rose':r.due<=now()?'amber':'muted'}">${r.result=='pass'?'Recalled':r.result=='fail'?'Gap added':r.due<=now()?'Due now':'Scheduled'}</div>${!r.doneAt&&r.due<=now()?`<button class="btn btn-sm mt-2 w-full" onclick="openReview('${r.id}')">Review</button>`:''}</li>`).join('')}</ul>`)}
 ${sec('Evidence on record',`<dl class="divide-y line border-y line text-sm">${EVIDENCE.map(([k,l])=>`<div class="py-2.5 grid sm:grid-cols-[12rem_1fr] gap-1"><dt class="muted">${l}</dt><dd class="break-words">${esc(w.evidence[k])}</dd></div>`).join('')}</dl>`)}
 ${sec('Attempt history',`<ul class="text-sm space-y-1">${w.attempts.map((x,i)=>`<li class="flex gap-3"><span class="muted w-16">#${i+1} ${fmt(x.at)}</span><span class="tabular-nums">${GATES.map(([k,l])=>l[0]+' '+x.gates[k]).join(' · ')}</span>${gatesPass(x)?'':'<span class="chip chip-g">Gap</span>'}</li>`).join('')}</ul>`)}</div>`}
// ---- Pilot (Week 43, own 4-calendar-week clock) ----
function pilotPanel(n){const p=S.pilot,can=isUnlocked(43);
 if(!p.activatedAt)return sec('Live pilot',`<div class="rounded-xl border line p-5"><p class="text-sm ink2">The pilot runs on its own four-calendar-week clock, separate from week locking. Start it when you actually go live.</p>
  <label class="flex items-center gap-2 text-sm mt-3"><input type="checkbox" ${p.simulated?'checked':''} onchange="S.pilot.simulated=this.checked;commit()">Label as SIMULATED (no consenting client yet)</label>
  <button class="btn btn-p mt-4" ${can?'':'disabled'} onclick="activatePilot()">${ic('play')}Activate pilot clock</button>${can?'':'<p class="text-xs muted mt-2">Available once Week 43 is unlocked.</p>'}</div>`);
 const el=Math.min(28,Math.floor((now()-p.activatedAt)/DAY));return sec('Live pilot',`<div class="rounded-xl border line p-5"><div class="flex items-center gap-2 text-sm"><span class="dot" style="background:var(--forest)"></span>Day ${el+1} of 28 ${p.simulated?'<span class="chip chip-a">SIMULATED</span>':''}<span class="ml-auto text-xs muted">Started ${fmt(p.activatedAt)}</span></div>
  <div class="grid grid-cols-4 gap-1.5 mt-3">${[1,2,3,4].map(i=>`<div><div class="h-1.5 rounded-full sunk overflow-hidden"><div class="h-full" style="background:var(--forest);width:${Math.max(0,Math.min(100,(el-(i-1)*7)/7*100))}%"></div></div><div class="text-[11px] muted mt-1">Pilot week ${i}</div></div>`).join('')}</div>
  <button class="btn btn-sm mt-4" onclick="S.pilot.interruptions.push({at:now()});commit('Interruption logged')">${ic('pause')}Log interruption</button><span class="text-xs muted ml-2">${p.interruptions.length} logged</span></div>`)}
function activatePilot(){confirmBox('Start the pilot clock?','This starts a four-calendar-week timeline today. It does not verify or unlock any week.',{ok:'Start clock'}).then(ok=>{if(!ok)return;S.pilot.activatedAt=now();audit('Pilot activated',S.pilot.simulated?'Labelled SIMULATED':'Real pilot with consent');commit('Pilot clock started')})}

// ===== Projects =====
let PJ_VIEW='roadmap';
const projState=p=>{const st=(S.proj[p.id]||{}).status;if(st)return st;const cur=currentWeek();return cur>p.wb?'Complete':cur>=p.wa?'Active':'Upcoming'};
const pChip=s=>`<span class="chip ${s=='Active'?'chip-a':s=='Complete'?'chip-v':''}">${s}</span>`;
function viewProjects(id){if(id)return id.startsWith('P')?projectDetail(PROJ.find(p=>p.id==id)):userProjectDetail(S.projects.find(p=>p.id==id));
 const tabs=[['roadmap','Roadmap projects',PROJ.length],['mine','My projects',S.projects.length],['ideas','Ideas',S.ideas.length]];
 return `<div class="fade"><div class="flex flex-wrap items-end justify-between gap-4"><div><p class="text-sm muted flex items-center gap-2">What you are building ${demoBadge()}</p><h1 class="serif text-4xl md:text-5xl mt-1">Projects</h1></div>
 ${PJ_VIEW=='mine'?`<button class="btn btn-p" onclick="newProject()">${ic('plus')}New project</button>`:PJ_VIEW=='ideas'?'':''}</div>
 <div role="tablist" class="mt-6 border-b line flex">${tabs.map(([k,l,c])=>`<button role="tab" aria-selected="${PJ_VIEW==k}" class="tab" onclick="PJ_VIEW='${k}';render()">${l}<span class="text-xs muted">${c}</span></button>`).join('')}</div>
 <div class="pt-6">${PJ_VIEW=='roadmap'?roadmapProjects():PJ_VIEW=='mine'?myProjects():ideasView()}</div></div>`}
function roadmapProjects(){return `<p class="text-sm muted mb-4">Built into the 91 weeks. Each has an acceptance contract; milestones are verified inside the mapped weeks.</p><ul class="divide-y line border-y line">${PROJ.map(p=>{const st=projState(p),x=S.proj[p.id]||{},last=(x.log||[])[0];return `<li><a href="#/projects/${p.id}" class="grid md:grid-cols-[3rem_1fr_9rem_7rem] gap-x-4 gap-y-1 py-4 hover:bg-[var(--sunk)] px-2 -mx-2 rounded-lg items-start">
  <span class="font-mono text-xs muted pt-1">${p.id}</span>
  <span class="min-w-0"><span class="font-medium block">${esc(p.name)}</span><span class="text-sm muted line-clamp-1 block">${esc(p.purpose.split('. ')[0])}.</span>${st=='Active'?`<span class="text-xs block mt-1.5 ink2">${ic('milestone','!w-3 !h-3 inline -mt-0.5 forest')} ${esc(projMilestoneFor(p,currentWeek()))}</span>`:''}</span>
  <span class="text-xs muted md:pt-1">Weeks ${p.wa}-${p.wb}${x.repo?`<span class="block mt-1 truncate">${ic('github','!w-3 !h-3 inline -mt-0.5')} ${esc(x.repo.replace('github.com/',''))}</span>`:''}${last?`<span class="block mt-1">Updated ${ago(last.at)}</span>`:''}</span>
  <span class="md:text-right md:pt-0.5">${pChip(st)}</span></a></li>`}).join('')}</ul>`}
function myProjects(){if(!S.projects.length)return emptyState('folder-plus','Your own projects live here','Side builds, experiments, things you make because you are curious. Kept separate from the roadmap so neither gets cluttered.',`<button class="btn btn-p" onclick="newProject()">${ic('plus')}New project</button>`);
 return `<ul class="divide-y line border-y line">${S.projects.map(p=>`<li><a href="#/projects/${p.id}" class="grid md:grid-cols-[1fr_9rem_7rem] gap-x-4 gap-y-1 py-4 px-2 -mx-2 rounded-lg hover:bg-[var(--sunk)]"><span><span class="font-medium block">${esc(p.name)}</span><span class="text-sm muted block">${esc(p.desc)}</span>${p.milestone?`<span class="text-xs ink2 block mt-1.5">Next: ${esc(p.milestone)}</span>`:''}</span><span class="text-xs muted">${p.weeks.length?'Week '+p.weeks.join(', '):'No linked week'}${p.repo?`<span class="block mt-1 truncate">${esc(p.repo)}</span>`:''}<span class="block mt-1">Updated ${ago(p.updated)}</span></span><span class="md:text-right">${pChip(p.status)}</span></a></li>`).join('')}</ul>`}
function ideasView(){return `<form onsubmit="addIdea(event)" class="flex gap-2 max-w-xl"><label for="idea" class="sr-only">New idea</label><input id="idea" class="inp" placeholder="A small idea, one line is enough"><button class="btn btn-p">${ic('plus')}Add</button></form>
 ${S.ideas.length?`<ul class="mt-6 space-y-2 max-w-3xl">${S.ideas.map(i=>`<li class="flex items-center gap-3 rounded-xl border line px-4 py-3 fade">${ic('lightbulb','amber shrink-0')}<span class="flex-1 text-sm">${esc(i.text)}</span><span class="text-xs muted hidden sm:inline">${ago(i.at)}</span><button class="btn btn-sm" onclick="ideaToProject('${i.id}')">${ic('arrow-up-right')}Make project</button><button class="btn btn-sm btn-g" aria-label="Delete idea" onclick="delIdea('${i.id}')">${ic('trash-2')}</button></li>`).join('')}</ul>`:emptyState('lightbulb','No ideas yet','Capture them here or from Today by starting a note with "idea:".')}`}
function addIdea(e){e.preventDefault();const v=$('#idea').value.trim();if(!v)return;S.ideas.unshift({id:uid(),text:v,at:now()});commit('Idea saved');setTimeout(()=>$('#idea')?.focus())}
function delIdea(id){const i=S.ideas.findIndex(x=>x.id==id),it=S.ideas[i];S.ideas.splice(i,1);commit();toast('Idea deleted',{undo:()=>{S.ideas.splice(i,0,it);commit()}})}
function ideaToProject(id){const it=S.ideas.find(x=>x.id==id);newProject(it.text,()=>{S.ideas=S.ideas.filter(x=>x.id!=id)})}

 </div><aside class="space-y-6 text-sm">${sec('Resources',`<ul class="space-y-1.5">${p.refs.map(r=>`<li><a class="forest hover:underline break-all" href="${r.u}" target="_blank" rel="noopener">${esc(r.u.replace(/^https?:\/\//,'').replace(/\/$/,''))}</a></li>`).join('')}</ul>`)}

 <span class="flex flex-wrap gap-1.5 mt-1.5">${n.week?`<span class="chip">W${n.week}</span>`:''}${n.project?`<span class="chip">${esc(n.project.startsWith('P')?n.project:'Project')}</span>`:''}${n.tags.map(t=>`<span class="text-[11px] muted">#${esc(t)}</span>`).join('')}</span></span>

function viewLibrary(id){if(id)return noteEditor(S.notes.find(n=>n.id==id));
 const all=S.notes;const tags=[...new Set(all.filter(n=>!n.deleted).flatMap(n=>n.tags))].sort();
 const q=LIB.q.toLowerCase();let ls=all.filter(n=>LIB.f=='trash'?n.deleted:LIB.f=='archived'?n.archived&&!n.deleted:!n.deleted&&!n.archived&&(LIB.f=='all'||n.kind==LIB.f));

 return `<div class="fade max-w-4xl"><div class="flex flex-wrap items-end justify-between gap-4"><div><p class="text-sm muted flex items-center gap-2">Notes and saved reading ${demoBadge()}</p><h1 class="serif text-4xl md:text-5xl mt-1">Library</h1></div><button class="btn btn-p" onclick="editNote(null)">${ic('plus')}New note</button></div>
 <form class="mt-7 surface flex items-center gap-2 pl-4 pr-1.5 h-12 shadow-soft" onsubmit="libCapture(event)">${ic('plus','muted')}<label for="lc" class="sr-only">Quick capture</label><input id="lc" class="flex-1 bg-transparent outline-none text-sm h-full" placeholder="Capture a note or paste a link, press Enter" autocomplete="off"><span class="kbd hidden sm:inline">Enter</span></form>

  <div class="flex gap-1 overflow-x-auto no-sb" role="tablist">${F.map(([k,l])=>`<button role="tab" aria-selected="${LIB.f==k}" onclick="LIB.f='${k}';render()" class="btn btn-sm ${LIB.f==k?'sage border-transparent':'btn-g'}">${l}</button>`).join('')}</div></div>
 ${tags.length?`<div class="flex flex-wrap gap-1.5 mt-3">${tags.map(t=>`<button onclick="LIB.tag=LIB.tag=='${esc(t)}'?'':'${esc(t)}';render()" aria-pressed="${LIB.tag==t}" class="chip ${LIB.tag==t?'chip-v':''}">#${esc(t)}</button>`).join('')}</div>`:''}
 <div class="mt-5">${ls.length?`<ul class="divide-y line border-y line">${ls.map(noteRow).join('')}</ul>`:LIB.q||LIB.tag?emptyState('search-x','No matches','Try fewer words, a tag, or a week like "w9".',`<button class="btn" onclick="LIB.q='';LIB.tag='';render()">Clear search</button>`):LIB.f=='trash'?emptyState('trash','Trash is empty','Deleted notes wait here until you restore them.'):emptyState('library','Your library is empty','Capture a note above or save resources from any week. Everything links back to where you learned it.')}</div></div>`}
function libCapture(e){e.preventDefault();const v=$('#lc').value.trim();if(!v)return;const isUrl=/^https?:\/\//.test(v);S.notes.unshift({id:uid(),kind:isUrl?'resource':'note',title:isUrl?v.replace(/^https?:\/\/(www\.)?/,'').slice(0,60):v.slice(0,80),url:isUrl?v:'',body:isUrl?'':'<p>'+esc(v)+'</p>',tags:['inbox'],week:currentWeek(),project:'',updated:now(),archived:false,deleted:false});commit(isUrl?'Resource saved':'Note saved');setTimeout(()=>$('#lc')?.focus())}
function renderKeep(id){const el=$('#'+id),p=el.selectionStart;render();const n=$('#'+id);n.focus();n.setSelectionRange(p,p)}
function editNote(id,preset={}){const n={id:uid(),kind:'note',title:'',body:'',tags:[],week:preset.week||currentWeek(),project:'',url:'',updated:now(),archived:false,deleted:false};S.notes.unshift(n);persist();location.hash='#/library/'+n.id}
function noteEditor(n){if(!n)return emptyState('file-x','Note not found','It may have been deleted permanently.',`<a class="btn" href="#/library">Back to Library</a>`);
 const tb=[['bold','bold','Bold'],['italic','italic','Italic'],['h2','heading-2','Heading'],['ul','list','Bulleted list'],['ol','list-ordered','Numbered list'],['quote','text-quote','Quote'],['code','code','Inline code'],['pre','square-code','Code block'],['link','link','Link']];
 return `<div class="fade max-w-3xl mx-auto"><div class="flex items-center gap-2"><a href="#/library" class="text-sm muted hover:underline flex items-center gap-1 mr-auto">${ic('arrow-left','!w-3.5 !h-3.5')}Library</a><span id="saved" class="text-xs muted" aria-live="polite">${n.deleted?'In trash':'Saved'}</span>

let nsT;function noteSave(id){const n=S.notes.find(x=>x.id==id);n.title=$('#nt').value;n.body=$('#nb').innerHTML;n.kind=$('#nk').value;n.week=+$('#nw').value||null;n.project=$('#np').value;n.tags=$('#ng').value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);n.url=$('#nu').value.trim();n.updated=now();

function fmtCmd(c,id){const ed=$('#nb');ed.focus();const m={bold:['bold'],italic:['italic'],h2:['formatBlock','h2'],ul:['insertUnorderedList'],ol:['insertOrderedList'],quote:['formatBlock','blockquote']};
 if(m[c])document.execCommand(...m[c]);else if(c=='code'){const s=getSelection().toString()||'code';document.execCommand('insertHTML',false,'<code>'+esc(s)+'</code>&nbsp;')}
 else if(c=='pre'){const s=getSelection().toString()||'// code';document.execCommand('insertHTML',false,'<pre><code>'+esc(s)+'</code></pre><p><br></p>')}
 else if(c=='link'){const u=prompt('Link URL','https://');if(u&&/^https?:\/\//.test(u))document.execCommand('createLink',false,u)}noteSave(id)}
function noteAct(id,a){const n=S.notes.find(x=>x.id==id);

 if(a=='restore'){n.deleted=false;commit('Restored')}
 if(a=='purge')confirmBox('Delete forever?','This note cannot be recovered.',{ok:'Delete forever',danger:true}).then(ok=>{if(!ok)return;S.notes=S.notes.filter(x=>x.id!=id);location.hash='#/library';commit('Deleted')})}

let psT;function postSave(id,statusChange){const p=S.posts.find(x=>x.id==id);p.title=$('#pt').value;p[PLT]=$('#pb').value;const ns=$('#ps').value;const was=p.status;p.status=ns;p.week=+$('#pw').value||null;p.project=$('#pp').value;const d=$('#pd').value;p.date=d?new Date(d+'T09:00').getTime():null;$$('[data-url]').forEach(i=>{const v=i.value.trim();if(v)p.urls[i.dataset.url]=v;else delete p.urls[i.dataset.url]});p.updated=now();
 const pl=PLAT.find(x=>x[0]==PLT),c=$('#pc');if(c){c.textContent=p[PLT].length+' / '+pl[2];c.classList.toggle('rose',p[PLT].length>pl[2])}

function addImg(id,inp){const f=inp.files[0];if(!f)return;if(f.size>1.5e6){toast('Image over 1.5 MB. Use a smaller preview.',{tone:'warn'});return}const r=new FileReader();r.onload=()=>{S.posts.find(x=>x.id==id).images.push(r.result);try{commit('Image attached')}catch(e){S.posts.find(x=>x.id==id).images.pop();toast('Browser storage is full',{tone:'warn'})}};r.readAsDataURL(f)}

function viewProgress(){const v=verifiedCount(),cur=currentWeek(),b=blockOf(cur),gaps=openGaps(),rv=S.reviews.filter(r=>r.doneAt),ret=rv.length?Math.round(rv.filter(r=>r.result=='pass').length/rv.length*100):null;
 const st={VERIFIED:0,DONE:0,ATTEMPTED:0};WEEKS.forEach(w=>{const s=peekWk(w.n).status;if(st[s]!==undefined)st[s]++});
 const projDone=PROJ.filter(p=>projState(p)=='Complete').length+S.projects.filter(p=>p.status=='Complete').length;

 return `<div class="fade"><p class="text-sm muted flex items-center gap-2">Evidence, not activity ${demoBadge()}</p><h1 class="serif text-4xl md:text-5xl mt-1">Progress</h1>
 ${blocksDone.length?`<p class="mt-4 text-sm flex items-center gap-2 forest">${ic('sparkles')}${blocksDone.length==1?'Block 1 complete':blocksDone.length+' blocks complete'}. Most recent: ${esc(blocksDone[blocksDone.length-1].name)}. Quietly well done.</p>`:''}
 <section class="grid sm:grid-cols-3 lg:grid-cols-6 mt-8 surface p-5 sm:py-6" aria-label="Summary">${stat('Verified',`${v}<span class="text-base muted font-normal"> / 91</span>`,Math.round(v/91*100)+'% of the journey')}${stat('Now',`Week ${cur}`,'Block '+b.n+' · '+esc(b.name))}${stat('Hours invested',Math.round(hoursTotal())+' h','of ~1,183 h minimum')}${stat('Open gaps',gaps.length,gaps.length?'Being worked on':'All resolved')}${stat('Review retention',ret==null?'n/a':ret+'%',rv.length+' reviews done')}${stat('Projects complete',projDone,'of '+(PROJ.length+S.projects.length))}</section>
 <div class="grid lg:grid-cols-[1.4fr_1fr] gap-6 mt-6">

function journeyChart(){const W_=560,H=250,p=28,vs=WEEKS.filter(w=>isVerified(w.n)).map(w=>peekWk(w.n).verifiedAt).sort((a,b)=>a-b);const t0=S.planStart,t1=Math.max(now(),t0+12*WEEK),span=t1-t0;const maxY=Math.max(12,Math.ceil((variance().planned+2)/4)*4);

 const pts=[[t0,0],...vs.map((t,i)=>[t,i+1]),[now(),vs.length]];const path=pts.map((q,i)=>(i?'L':'M')+x(q[0]).toFixed(1)+','+y(q[1]).toFixed(1)).join('');
 const plan=`M${x(t0)},${y(0)}L${x(t1)},${y(Math.min(91,span/WEEK))}`;
 if(!vs.length)return `<div class="h-[200px] grid place-items-center text-center"><div><div class="serif text-2xl">Your line starts here</div><p class="text-sm muted mt-1">Verify Week 1 and the first point appears.</p></div></div>`;
 return `<svg viewBox="0 0 ${W_} ${H}" class="w-full mt-4" role="img" aria-label="${vs.length} weeks verified over time">${[0,maxY/2,maxY].map(c=>`<g><line x1="${p}" x2="${W_-p/2}" y1="${y(c)}" y2="${y(c)}" stroke="var(--line)"/><text x="${p-8}" y="${y(c)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${c}</text></g>`).join('')}
 <path d="${plan}" stroke="var(--muted)" stroke-dasharray="4 4" fill="none" opacity=".6"/><path d="${path}" stroke="var(--forest)" stroke-width="2" fill="none" stroke-linejoin="round" style="stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.2s ease forwards"/>${vs.map((t,i)=>`<circle cx="${x(t)}" cy="${y(i+1)}" r="2.5" fill="var(--forest)"/>`).join('')}
 <text x="${p}" y="${H-6}" font-size="10" fill="var(--muted)">${fmt(t0)}</text><text x="${W_-p/2}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">Today</text><style>@keyframes draw{to{stroke-dashoffset:0}}</style></svg>`}
function gateChart(){const vw=WEEKS.filter(w=>isVerified(w.n));if(!vw.length)return emptyState('chart-column','No scores yet','Each verified week adds its final gate scores here.');
 const first=vw.filter(w=>gatesPass(peekWk(w.n).attempts[0])).length;
 return `<div class="space-y-4 mt-5">${GATES.map(([k,l])=>{const c=[0,0,0,0,0];vw.forEach(w=>c[lastAttempt(w.n).gates[k]]++);const fails=S.gaps.filter(g=>g.gate==k).length;return `<div><div class="flex justify-between text-sm"><span>${l}</span><span class="text-xs muted">${fails?fails+' gap'+(fails>1?'s':'')+' so far':'no gaps'}</span></div><div class="flex h-2.5 rounded-full overflow-hidden mt-1.5 gap-px sunk">${[3,4].map(s=>c[s]?`<div style="width:${c[s]/vw.length*100}%;background:${s==4?'var(--forest)':'color-mix(in srgb,var(--forest) 55%,transparent)'}" title="${c[s]} weeks at ${s}"></div>`:'').join('')}</div></div>`}).join('')}

 ${sec('Data',`<div class="surface p-5 flex flex-wrap gap-2"><button class="btn" onclick="demoMenu()">${ic('layers')}Demo state: ${MODE=='real'?'Off':DEMO_LABEL[MODE.split(':')[1]]}</button>${MODE!='real'?`<button class="btn" onclick="resetDemo()">${ic('rotate-ccw')}Reset demo data</button>`:''}<button class="btn" onclick="exportData()">${ic('download')}Export JSON</button></div><p class="text-xs muted mt-2">Prototype stores data in this browser only. The real app keeps it in Cloudflare D1.</p>`)}
 </div></div>`}
function toggleLocking(){if(S.locking){confirmBox('Turn off strict locking?','Every week becomes openable. Opening a week out of order is recorded as an override, never as verification. Gates and evidence are still required.',{ok:'Turn off locking',danger:true,typed:'UNLOCK'}).then(ok=>{if(!ok)return;S.locking=false;audit('Locking disabled','Strict locking turned OFF by learner after typed confirmation.');commit('Locking off. This is in the audit log.')})}
 else{S.locking=true;audit('Locking enabled','Strict locking turned ON.');commit('Strict locking on')}}
function addOverride(){const n=+$('#ovw').value,r=$('#ovr').value.trim();if(!(n>=2&&n<=91)){toast('Pick a week from 2 to 91',{tone:'warn'});return}if(!r){toast('Add a reason. It goes in the audit log.',{tone:'warn'});return}if(isUnlocked(n)){toast('Week '+n+' is already open',{tone:'warn'});return}
 confirmBox('Unlock Week '+n+' with an override?','Week '+n+' opens for study. Week '+(n-1)+' stays unverified, and nothing is marked Verified.',{ok:'Unlock with override',typed:'OVERRIDE'}).then(ok=>{if(!ok)return;S.overrides.push({id:uid(),week:n,reason:r,at:now()});audit('Unlock override','Week '+n+' opened without verifying Week '+(n-1)+'. Reason: '+r);commit('Week '+n+' unlocked by override')})}
function revokeOverride(id){const o=S.overrides.find(x=>x.id==id);o.revoked=now();audit('Override revoked','Week '+o.week+' override revoked.');commit('Override revoked')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='learning-os-'+(MODE.replace(':','-'))+'.json';a.click();toast('Export downloaded')}

// ===== Demo login: email one-time code (no real email is sent) =====
let LG={step:'email',email:'',code:'',issued:0,cool:0,err:'',ok:false};const DEMO_CODE='482913';
function viewLogin(){const s=LG;return `<div class="min-h-screen grid lg:grid-cols-2">
 <div class="hidden lg:flex flex-col justify-between p-12 border-r line sunk"><div class="flex items-center gap-2.5"><div class="h-8 w-8 rounded-lg bg-forest grid place-items-center">${ic('sprout','!w-4 !h-4')}</div><span class="serif text-xl">Learning OS</span></div>
  <div><p class="serif text-5xl leading-[1.05] max-w-md">Ninety-one weeks.<br><span class="muted">One verified step at a time.</span></p><p class="muted mt-5 max-w-sm text-sm leading-relaxed">A private study desk for the FDE and deep fundamentals roadmap. Single user, no feeds, no streaks.</p></div>
  <p class="text-xs muted">Prototype · demo authentication</p></div>
 <div class="flex items-center justify-center p-6"><div class="w-full max-w-sm fade">
  <div class="lg:hidden flex items-center gap-2.5 mb-10"><div class="h-8 w-8 rounded-lg bg-forest grid place-items-center">${ic('sprout','!w-4 !h-4')}</div><span class="serif text-xl">Learning OS</span></div>
  ${s.ok?`<div class="text-center" role="status"><div class="pop mx-auto h-14 w-14 rounded-full bg-forest grid place-items-center">${ic('check','!w-7 !h-7')}</div><h1 class="serif text-3xl mt-5">Welcome back</h1><p class="muted text-sm mt-1">Opening your desk...</p></div>`:
  s.step=='email'?`<h1 class="serif text-4xl">Sign in</h1><p class="muted text-sm mt-2">Enter the authorized email. We will send a 6-digit code.</p>
   <form class="mt-8" onsubmit="lgSend(event)" novalidate><label class="text-sm font-medium" for="le">Email</label><input id="le" type="email" autocomplete="email" class="inp mt-1.5 !h-11" value="${esc(s.email)}" placeholder="you@example.com" ${s.err?'aria-invalid="true" aria-describedby="lerr"':''}>${s.err?`<p id="lerr" class="text-sm rose mt-2">${esc(s.err)}</p>`:''}<button class="btn btn-p btn-lg w-full mt-5">Send code</button></form>`:
  `<button class="text-sm muted hover:underline flex items-center gap-1" onclick="LG.step='email';LG.err='';render()">${ic('arrow-left','!w-3.5 !h-3.5')}Change email</button><h1 class="serif text-4xl mt-4">Check your inbox</h1><p class="muted text-sm mt-2">Enter the code sent to <b class="ink2">${esc(s.email)}</b>. It expires in 10 minutes.</p>
   <form class="mt-8" onsubmit="lgVerify(event)"><fieldset><legend class="text-sm font-medium">6-digit code</legend><div class="flex gap-2 mt-2" onpaste="lgPaste(event)">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" class="inp !h-12 !w-full text-center text-lg font-mono ${s.err?'!border-[var(--rose)]':''}" data-d="${i}" value="${s.code[i]||''}" oninput="lgDigit(this)" onkeydown="lgKey(event,this)">`).join('')}</div></fieldset>
   ${s.err?`<p class="text-sm rose mt-3 flex items-center gap-1.5" role="alert">${ic('circle-alert')}${esc(s.err)}</p>`:''}
   <button class="btn btn-p btn-lg w-full mt-5">Continue</button></form>
   <div class="mt-4 text-sm text-center">${s.cool>0?`<span class="muted">Resend available in ${s.cool}s</span>`:`<button class="forest hover:underline" onclick="lgResend()">Resend code</button>`}</div>`}
  ${s.ok?'':`<div class="mt-10 rounded-xl bg-amber border p-4 text-xs leading-relaxed"><div class="font-medium flex items-center gap-1.5">${ic('flask-conical','!w-3.5 !h-3.5')}Demo login</div><p class="mt-1">No email is sent. Authorized: <b>${esc(S.email)}</b>. ${s.step=='code'?`Code: <b class="font-mono">${DEMO_CODE}</b>. <button class="underline" onclick="LG.issued=now()-11*6e4;toast('Code is now expired',{tone:'warn'})">Simulate expiry</button>`:'The real app uses Cloudflare Access one-time PIN.'}</p></div>`}
 </div></div></div>`}
let lgTimer;function lgCool(){LG.cool=30;clearInterval(lgTimer);lgTimer=setInterval(()=>{LG.cool--;if(LG.cool<=0)clearInterval(lgTimer);if(route().p=='login'&&LG.step=='code'){const d=document.activeElement?.dataset?.d;render();if(d!=null)$(`[data-d="${d}"]`)?.focus()}},1000)}
function lgSend(e){e.preventDefault();const v=$('#le').value.trim().toLowerCase();LG.email=v;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){LG.err='Enter a valid email address.';render();return}
 if(v!==S.email.toLowerCase()){LG.err='This email is not authorized for this workspace.';render();return}LG.err='';LG.step='code';LG.code='';LG.issued=now();lgCool();render();setTimeout(()=>$('[data-d="0"]')?.focus());toast('Demo: code generated, no email sent')}
function lgResend(){LG.issued=now();LG.code='';LG.err='';lgCool();render();toast('Demo: new code generated');$('[data-d="0"]')?.focus()}
function lgDigit(el){el.value=el.value.replace(/\D/g,'').slice(-1);const ds=$$('[data-d]');LG.code=ds.map(d=>d.value).join('');if(el.value&&+el.dataset.d<5)ds[+el.dataset.d+1].focus();if(LG.code.length==6)lgVerify()}
function lgKey(e,el){if(e.key=='Backspace'&&!el.value&&+el.dataset.d>0)$$('[data-d]')[+el.dataset.d-1].focus()}
function lgPaste(e){const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();LG.code=t;render();if(t.length==6)lgVerify()}
function lgVerify(e){e&&e.preventDefault();LG.code=$$('[data-d]').map(d=>d.value).join('');
 if(LG.code.length<6){LG.err='Enter all 6 digits.';render();return}
 if(now()-LG.issued>10*6e4){LG.err='This code has expired. Request a new one.';LG.code='';render();return}
 if(LG.code!==DEMO_CODE){LG.err='That code is not right. Check it and try again.';LG.code='';render();$('[data-d="0"]')?.focus();return}
 LG.ok=true;render();localStorage.setItem(K.auth,JSON.stringify({email:LG.email,at:now()}));setTimeout(()=>{LG={step:'email',email:'',code:'',issued:0,cool:0,err:'',ok:false};location.hash='#/today'},1100)}

function grow(t){if(CSS.supports('field-sizing','content'))return;t.style.height='auto';t.style.height=Math.max(416,t.scrollHeight)+'px'}
// ===== Boot and render =====
(function(){const q=new URLSearchParams(location.search);if(q.get('mode')){MODE=q.get('mode');localStorage.setItem(K.mode,MODE)}if(q.get('auth')=='demo')localStorage.setItem(K.auth,JSON.stringify({email:'vaibhav@example.com',at:Date.now()}));if(q.get('reset'))localStorage.removeItem(MODE=='real'?K.real:K.demo(MODE.split(':')[1]))})();
load();
function render(){const {p,rest}=route();const authed=!!localStorage.getItem(K.auth);
 if(!authed||p=='login'){if(authed&&p=='login'&&!LG.ok){location.hash='#/today';return}$('#app').innerHTML=viewLogin();lucide.createIcons();document.title='Sign in · Learning OS';return}
 const views={today:viewToday,roadmap:viewRoadmap,week:()=>viewWeek(rest[0]||currentWeek(),rest[1]),projects:()=>viewProjects(rest[0]),library:()=>viewLibrary(rest[0]),studio:()=>viewStudio(rest[0]),progress:viewProgress,settings:viewSettings};
 const active={week:'roadmap',settings:''}[p]??p;const html=(views[p]||viewToday)();
 const y=window.scrollY,same=render.last==location.hash;render.last=location.hash;
 $('#app').innerHTML=layout(html,active);lucide.createIcons();const pb=$('#pb');if(pb)grow(pb);const at=$('[role=tablist] [aria-selected=true]');if(at){const tl=at.parentElement;if(tl.scrollWidth>tl.clientWidth)tl.scrollLeft=at.offsetLeft-tl.clientWidth/2+at.offsetWidth/2}if(same)window.scrollTo(0,y);
 document.title=({today:'Today',roadmap:'Roadmap',week:'Week '+(rest[0]||''),projects:'Projects',library:'Library',studio:'Content Studio',progress:'Progress',settings:'Settings'}[p]||'Today')+' · Learning OS'}
window.addEventListener('hashchange',()=>{closeLayer();render();window.scrollTo(0,0);$('#main')?.focus({preventScroll:true})});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();if(localStorage.getItem(K.auth))openPalette()}if(e.key=='Escape')closeLayer();
 const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable;
 if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('#layer').innerHTML){if(e.key=='/'){const s=$('#ls,#cq');if(s){e.preventDefault();s.focus()}}if(/^[1-6]$/.test(e.key)&&localStorage.getItem(K.auth)&&route().p!='login')location.hash='#/'+NAV[+e.key-1][0]}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(UI.theme=='system')setTheme('system')});
render();

</script></body></html>
